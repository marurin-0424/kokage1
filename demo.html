<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>こかげ — 操作動画（43秒・無音）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23eb6834%22/%3E%3Cpath d=%22M32 0 L32 32 L0 32 Z%22 fill=%22%232a78d6%22/%3E%3C/svg%3E">
<style>
:root{--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--plane:#f4f4f1;--hair:#e1e0d9;--park:#1baf7a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--plane);color:var(--ink);
 font-family:"Noto Sans CJK JP","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
 -webkit-font-smoothing:antialiased;padding:28px 20px 56px}
.wrap{max-width:520px;margin:0 auto}
.lg{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mark{width:34px;height:34px;border-radius:9px;
 background:linear-gradient(135deg,#eb6834 0 50%,#2a78d6 50% 100%)}
h1{font-size:30px;letter-spacing:.02em}
h1 em{color:var(--park);font-style:normal}
.sub{font-size:15px;color:var(--ink2);margin-bottom:4px}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:18px}
video{width:100%;max-width:430px;display:block;margin:0 auto;
 border:1px solid var(--hair);border-radius:16px;background:#fff}
.note{font-size:12.5px;color:var(--muted);line-height:1.85;margin-top:18px}
a{color:#2a78d6}
</style>
</head>
<body>
<div class="wrap">
  <div class="lg"><i class="mark"></i><h1>こ<em>か</em>げ</h1></div>
  <p class="sub">子どもの夏を、楽しく安全に</p>
  <p class="meta">操作動画（43秒・無音）／都知事杯オープンデータ・ハッカソン2026</p>

  <video src="demo.mp4" controls playsinline preload="metadata"></video>

  <p class="note">
    実際の画面を、操作しながら録画したものです。音声はありません。<br>
    暑さ指数は「去年8月の平均時刻差」で固定して撮っています（`?fixed=1`）。
    実際に開くと、その日の環境省の予測値を取り込みます。<br>
    動くものはこちら → <a href="./">こかげ（デモ）</a>
  </p>
</div>
</body>
</html>
